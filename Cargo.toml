[workspace]
resolver = "3"
members = [
    "crates/audiophore-core",
    "crates/audiophore-engine",
    "crates/audiophore-audio",
    "crates/audiophore-cli",
    "crates/audiophore-adapter-core",
    "crates/audiophore-adapter-sacn",
    "crates/audiophore-ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Aaron Cupp <mrcupp@mrcupp.com>"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/audiophore/audiophore"
homepage = "https://audiophore.dev"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
