[package]
name = "audiophore-cli"
description = "Audiophore binary entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[[bin]]
name = "audiophore"
path = "src/main.rs"

[dependencies]
audiophore-audio = { path = "../audiophore-audio", version = "0.1" }
audiophore-core = { path = "../audiophore-core", version = "0.1" }
audiophore-engine = { path = "../audiophore-engine", version = "0.1" }
audiophore-adapter-core = { path = "../audiophore-adapter-core", version = "0.1" }
audiophore-adapter-sacn = { path = "../audiophore-adapter-sacn", version = "0.1" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rosc = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "sync", "time"] }
criterion = "0.5"

[[bench]]
name = "pipeline_latency"
harness = false
