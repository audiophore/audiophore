[package]
name = "audiophore-audio"
description = "OSC ingress and audio frame production from Synesthesia."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
audiophore-core = { path = "../audiophore-core", version = "0.1" }
rosc = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["net", "rt", "macros", "sync"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "macros", "sync", "time", "rt-multi-thread"] }

[lints]
workspace = true
