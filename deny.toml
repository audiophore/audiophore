[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # webpki-root-certs (Mozilla CA bundle, via reqwest in tauri-plugin-updater) —
    # CDLA-Permissive-2.0 covers the certificate *data*; permissive, no copyleft.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.92

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
ignore = [
    # Tauri transitive deps below. None are direct deps of audiophore-*
    # crates — all come in via `tauri` v2.x. Revisit on every Tauri bump
    # (the upstream PR that drops gtk3 / migrates off rust-unic / replaces
    # the cookie crate would let us drop the corresponding entries).
    #
    # gtk-rs GTK3 bindings — unmaintained. Linux-only, pulled in by the
    # Tauri Linux backend. We don't ship a Linux GUI (research-gui-framework
    # §5.8: Linux = headless / engine-only); these never enter the .app
    # bundle. Build-graph noise, not runtime risk.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # proc-macro-error — unmaintained. Build-time macro infrastructure
    # used by many crates; replaced upstream by proc-macro-error2 but the
    # transitive chain hasn't fully migrated.
    "RUSTSEC-2024-0370",
    # rust-unic family — unmaintained. Pulled via tauri-utils -> urlpattern
    # -> unic-ucd-*. Out of our control until upstream urlpattern moves off
    # rust-unic.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
